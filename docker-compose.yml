
services:
  backend:
    build: ./pos-backend
    container_name: fast-api-service
    ports:
      - "8000:8000"
      
    networks:
      - app-net



  frontend:
    build: ./pos-frontend
    container_name: react-frontend-service
    ports:
      - "5173:5173"
    networks:
      - app-net


  database:
    image: postgres:15
    container_name: postgres-database
    environment:
      POSTGRES_USER: saas_user
      POSTGRES_PASSWORD: saas_password
      POSTGRES_DB: saas_db
    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - app-net

volumes:
  postgres-data:
    driver: local

networks:
  app-net:
    driver: bridge